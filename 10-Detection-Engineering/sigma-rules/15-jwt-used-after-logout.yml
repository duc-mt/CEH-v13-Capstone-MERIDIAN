title: JWT Used After Logout Event
id: f24c7052-1bc1-56fa-87c8-618237f3a1ed
status: experimental
logsource: {category: application}
detection:
  selection: {event: 'logout'}
  followed_by: {event: 'api_request', same_jwt_jti: true, within: 15m}
  condition: selection and followed_by
level: medium
tags: [attack.credential_access, attack.t1539]
