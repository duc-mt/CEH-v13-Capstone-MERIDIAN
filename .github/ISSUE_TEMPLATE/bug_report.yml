name: Documentation Bug / Inconsistency
description: Broken cross-reference, topology mismatch, inconsistent finding ID, etc.
title: "[Bug] <short description>"
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: File(s) affected
      placeholder: "topology/1-IP-VLAN-Addressing-Scheme.md"
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What's wrong?
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: What should it say instead?
